<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Khôi phục PIN – Kho Thép Bãi</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <div class="login f1 scroll">
    <div style="font-size:26px;font-weight:700">Khôi phục PIN Admin</div>
    <div class="muted" style="font-size:16px;line-height:1.6">Dùng khi admin duy nhất quên PIN.<br>Cần nhập <b>Recovery Token</b> bạn đã đặt trong Cloudflare.</div>
    <label class="field">Recovery Token<input id="token" type="password" autocomplete="off" placeholder="Token bí mật"></label>
    <label class="field">Số điện thoại admin<input id="phone" type="tel" inputmode="numeric" placeholder="0912345678"></label>
    <label class="field">PIN mới (4 số)<input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••"></label>
    <label class="field">Nhập lại PIN mới<input id="pin2" type="password" inputmode="numeric" maxlength="4" placeholder="••••"></label>
    <div class="err" id="msg"></div>
    <button class="btn pri full" style="height:60px;font-size:20px" id="go">ĐẶT LẠI PIN</button>
    <a href="/" class="btn full" style="text-align:center;text-decoration:none;font-size:15px">← Về trang đăng nhập</a>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
$('go').onclick = async () => {
  const msg = $('msg');
  const token = $('token').value.trim();
  const phone = $('phone').value.trim();
  const pin = $('pin').value;
  const pin2 = $('pin2').value;
  if (!token || !phone || pin.length !== 4) { msg.textContent = 'Điền đầy đủ token, số điện thoại và PIN 4 số'; return; }
  if (pin !== pin2) { msg.textContent = 'Hai lần nhập PIN không giống nhau'; return; }
  msg.style.color = ''; msg.textContent = 'Đang xử lý...';
  try {
    const r = await fetch('/api/recover', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, phone, newPin: pin }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Lỗi ' + r.status);
    msg.style.color = '#176B34';
    msg.textContent = 'Đã đặt lại PIN cho ' + d.name + '. Đang chuyển sang đăng nhập...';
    setTimeout(() => (location.href = '/'), 1500);
  } catch (e) { msg.style.color = ''; msg.textContent = e.message; }
};
</script>
</body>
</html>
